name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Shell and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x install.sh upgrade.sh uninstall.sh lib/common.sh scripts/*.sh tests/*.sh
      - name: bash -n
        run: for f in install.sh upgrade.sh uninstall.sh lib/common.sh tests/*.sh; do bash -n "$f"; done
      - name: Compose configuration
        run: tests/compose-config.sh

  edge:
    name: Edge TLS gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/edge-tls.sh

  dry-run:
    name: Installer dry run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: tests/dry-run.sh ubuntu:24.04 ubuntu:26.04
