# Dependabot keeps dependencies current. Security updates are separate (enabled
# in repository settings) and skip the cooldown; version updates below wait 7
# days after a release so a hijacked package is usually caught before it lands.
#
# Dependabot reads caddy/Dockerfile.dns. The digests in versions.env and the
# agent and gVisor pins are moved by hand in a release pull request, because
# Dependabot cannot read an env file.
version: 2
updates:
  - package-ecosystem: 'docker'
    directory: '/caddy'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Jakarta'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Jakarta'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions-minor-patch:
        update-types: ['minor', 'patch']
